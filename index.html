<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Top Picks | API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-white min-h-screen p-8 font-sans">

    <div class="max-w-5xl mx-auto">
        
        <!-- Header Section -->
        <div class="mb-10 text-center">
            <div class="inline-flex items-center justify-center gap-3 mb-3">
                <span class="text-4xl">⭐</span>
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-pink-500">
                    My Premium Picks
                </h1>
            </div>
            <p class="text-zinc-400">Fetching handpicked projects from the Master API Hub</p>
        </div>

        <!-- Status & Error Alert -->
        <div id="status-message" class="hidden p-4 mb-8 rounded-xl font-bold text-sm shadow-lg text-center max-w-2xl mx-auto"></div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-16">
            <div class="inline-block w-10 h-10 border-4 border-violet-500 border-t-transparent rounded-full animate-spin shadow-[0_0_15px_rgba(139,92,246,0.5)]"></div>
            <p class="mt-4 text-violet-400/80 text-xs font-bold tracking-[0.2em] uppercase">Syncing with Master Hub...</p>
        </div>

        <!-- Picks Grid -->
        <div id="picks-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards JS se yahan aayenge -->
        </div>
    </div>

    <script>
        // AAPKI PICKS API KA ORIGINAL LINK
        const PICKS_API_URL = "https://mrsaqib242.vercel.app/api/public/picks";

        async function fetchMyPicks() {
            const statusDiv = document.getElementById('status-message');
            const loadingDiv = document.getElementById('loading');
            const gridDiv = document.getElementById('picks-grid');

            try {
                const response = await fetch(PICKS_API_URL);
                const result = await response.json();

                loadingDiv.classList.add('hidden');

                if (response.ok && result.success) {
                    
                    // 🟢 SUCCESS: Bouncer ne whitelist check pass kar liya
                    statusDiv.classList.remove('hidden');
                    statusDiv.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
                    statusDiv.innerHTML = `✅ Successfully connected! Master Hub sent <b>${result.count}</b> premium picks.`;

                    gridDiv.classList.remove('hidden');
                    
                    // Picks loop & Card Rendering
                    result.data.forEach(pick => {
                        const gradient = pick.gradient || 'from-zinc-700 to-zinc-900';
                        
                        gridDiv.innerHTML += `
                            <div class="relative bg-black p-6 rounded-2xl border border-white/10 hover:border-violet-500/50 hover:shadow-[0_0_30px_rgba(139,92,246,0.15)] transition-all duration-300 group flex flex-col h-full">
                                <!-- Top Accent Line -->
                                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${gradient} opacity-80 rounded-t-2xl"></div>
                                
                                <div class="flex-1 mt-2">
                                    <h3 class="text-xl font-bold mb-2 text-white group-hover:text-violet-300 transition-colors">${pick.name}</h3>
                                    <p class="text-zinc-400 text-sm mb-4 line-clamp-3">${pick.description || 'Exclusive portfolio project by MrSaqib.'}</p>
                                </div>
                                
                                <div class="mt-4">
                                    <a href="${pick.url}" target="_blank" class="flex w-full items-center justify-center gap-2 px-4 py-3 bg-white/5 hover:bg-violet-600 hover:text-white text-zinc-300 text-xs font-bold rounded-xl transition-all duration-300">
                                        View Live Project 🚀
                                    </a>
                                </div>
                            </div>
                        `;
                    });

                } else {
                    // 🔴 API OFF Ya Server Error
                    statusDiv.classList.remove('hidden');
                    statusDiv.classList.add('bg-orange-500/10', 'text-orange-400', 'border', 'border-orange-500/30');
                    statusDiv.innerHTML = `⚠️ Access Restricted: ${result.error || 'Picks API is disabled by Admin.'}`;
                }

            } catch (error) {
                // 🔴 CORS ERROR (Not Whitelisted)
                loadingDiv.classList.add('hidden');
                statusDiv.classList.remove('hidden');
                statusDiv.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/30');
                statusDiv.innerHTML = `🛑 Security Alert (CORS): Master Hub blocked this connection. Please add this domain to the Allowed List in your Admin Panel!`;
            }
        }

        // Execution Start
        fetchMyPicks();
    </script>
</body>
</html>
