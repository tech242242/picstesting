<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Picks | API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-white min-h-screen p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        
        <!-- Header Section -->
        <div class="mb-10 text-center">
            <div class="inline-flex items-center justify-center gap-3 mb-3">
                <span class="text-4xl">📸</span>
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-pink-500">
                    Gallery Premium Picks
                </h1>
            </div>
            <p class="text-zinc-400">Fetching visual gallery items from the Master API Hub</p>
        </div>

        <!-- Status & Error Alert -->
        <div id="status-message" class="hidden p-4 mb-8 rounded-xl font-bold text-sm shadow-lg text-center max-w-2xl mx-auto"></div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-16">
            <div class="inline-block w-10 h-10 border-4 border-violet-500 border-t-transparent rounded-full animate-spin shadow-[0_0_15px_rgba(139,92,246,0.5)]"></div>
            <p class="mt-4 text-violet-400/80 text-xs font-bold tracking-[0.2em] uppercase">Syncing with Gallery...</p>
        </div>

        <!-- Picks Grid -->
        <div id="picks-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Images JS se yahan aayenge -->
        </div>
    </div>

    <script>
        const PICKS_API_URL = "https://mrsaqib242.vercel.app/api/public/picks";

        async function fetchGalleryPicks() {
            const statusDiv = document.getElementById('status-message');
            const loadingDiv = document.getElementById('loading');
            const gridDiv = document.getElementById('picks-grid');

            try {
                const response = await fetch(PICKS_API_URL);
                const result = await response.json();

                loadingDiv.classList.add('hidden');

                if (response.ok && result.success) {
                    
                    statusDiv.classList.remove('hidden');
                    statusDiv.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
                    statusDiv.innerHTML = `✅ Successfully connected! Master Hub sent <b>${result.count}</b> gallery photos.`;

                    gridDiv.classList.remove('hidden');
                    
                    // Gallery Render Loop
                    result.data.forEach(pick => {
                        gridDiv.innerHTML += `
                            <div class="relative bg-black rounded-2xl border border-white/10 hover:border-violet-500/50 hover:shadow-[0_0_30px_rgba(139,92,246,0.15)] transition-all duration-300 group overflow-hidden">
                                <div class="aspect-square w-full overflow-hidden bg-zinc-900">
                                    <img src="${pick.image_url}" alt="${pick.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                </div>
                                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                                    <h3 class="text-sm font-bold text-white">${pick.title || 'Gallery Pick'}</h3>
                                    <span class="text-[10px] text-violet-300 uppercase tracking-wider font-bold mt-1">${pick.category || 'Visual'}</span>
                                </div>
                            </div>
                        `;
                    });

                } else {
                    statusDiv.classList.remove('hidden');
                    statusDiv.classList.add('bg-orange-500/10', 'text-orange-400', 'border', 'border-orange-500/30');
                    statusDiv.innerHTML = `⚠️ Access Restricted: ${result.error || 'Picks API is disabled by Admin.'}`;
                }

            } catch (error) {
                loadingDiv.classList.add('hidden');
                statusDiv.classList.remove('hidden');
                statusDiv.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/30');
                statusDiv.innerHTML = `🛑 Security Alert (CORS): Master Hub blocked this connection. Please add this domain to the Allowed List in your Admin Panel!`;
            }
        }

        fetchGalleryPicks();
    </script>
</body>
</html>
