<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Info | API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-8 font-sans flex items-center justify-center">

    <div class="w-full max-w-2xl mx-auto">
        
        <!-- Header Section -->
        <div class="mb-10 text-center">
            <div class="inline-flex items-center justify-center gap-3 mb-3">
                <span class="text-4xl">📞</span>
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    Master Contact Hub
                </h1>
            </div>
            <p class="text-slate-400">Fetching live contact info from MrSaqib242</p>
        </div>

        <!-- Status & Error Alert -->
        <div id="status-message" class="hidden p-4 mb-6 rounded-xl font-bold text-sm shadow-lg text-center"></div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block w-10 h-10 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin shadow-[0_0_15px_rgba(6,182,212,0.5)]"></div>
            <p class="mt-4 text-cyan-400/80 text-xs font-bold tracking-[0.2em] uppercase">Fetching Details...</p>
        </div>

        <!-- Contact Card -->
        <div id="contact-card" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl shadow-cyan-900/20 max-w-md mx-auto relative overflow-hidden group">
            
            <!-- Glowing Background Accent -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-500/20 blur-3xl rounded-full group-hover:bg-cyan-500/30 transition-all duration-500"></div>

            <div class="relative z-10 text-center mb-8">
                <div class="w-20 h-20 mx-auto bg-gradient-to-br from-cyan-500 to-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-cyan-500/30 mb-4 border-4 border-slate-900">
                    <span class="text-3xl text-white">👨‍💻</span>
                </div>
                <h2 class="text-2xl font-bold text-white">Saqib Developer</h2>
                <p class="text-cyan-400 text-sm mt-1">Available for freelance work</p>
            </div>

            <div class="space-y-4 relative z-10" id="contact-details">
                <!-- JS se Email aur WhatsApp aayega -->
            </div>
        </div>
    </div>

    <script>
        // AAPKI CONTACT API KA LINK
        const CONTACT_API_URL = "https://mrsaqib242.vercel.app/api/public/contact";

        async function fetchContactInfo() {
            const statusDiv = document.getElementById('status-message');
            const loadingDiv = document.getElementById('loading');
            const cardDiv = document.getElementById('contact-card');
            const detailsDiv = document.getElementById('contact-details');

            try {
                const response = await fetch(CONTACT_API_URL);
                const result = await response.json();

                loadingDiv.classList.add('hidden');

                if (response.ok && result.success) {
                    
                    statusDiv.classList.remove('hidden');
                    statusDiv.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
                    statusDiv.innerHTML = `✅ Contact data fetched successfully!`;

                    cardDiv.classList.remove('hidden');
                    
                    const data = result.data;
                    
                    detailsDiv.innerHTML = `
                        <!-- Email Block -->
                        <a href="mailto:${data.email}" class="flex items-center gap-4 p-4 rounded-2xl bg-slate-800/50 border border-slate-700 hover:border-cyan-500 hover:bg-slate-800 transition-all group">
                            <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-lg group-hover:bg-cyan-500 group-hover:text-white transition-colors">
                                ✉️
                            </div>
                            <div class="flex-1 text-left">
                                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Email Address</p>
                                <p class="text-sm font-medium text-slate-200 mt-0.5 truncate">${data.email}</p>
                            </div>
                        </a>

                        <!-- WhatsApp Block -->
                        <a href="https://wa.me/${data.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="flex items-center gap-4 p-4 rounded-2xl bg-slate-800/50 border border-slate-700 hover:border-green-500 hover:bg-slate-800 transition-all group">
                            <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-lg group-hover:bg-green-500 group-hover:text-white transition-colors">
                                💬
                            </div>
                            <div class="flex-1 text-left">
                                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">WhatsApp</p>
                                <p class="text-sm font-medium text-slate-200 mt-0.5">${data.whatsapp}</p>
                            </div>
                        </a>
                    `;

                } else {
                    statusDiv.classList.remove('hidden');
                    statusDiv.classList.add('bg-orange-500/10', 'text-orange-400', 'border', 'border-orange-500/30');
                    statusDiv.innerHTML = `⚠️ Access Restricted: ${result.error || 'Contact API is disabled.'}`;
                }

            } catch (error) {
                loadingDiv.classList.add('hidden');
                statusDiv.classList.remove('hidden');
                statusDiv.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/30');
                statusDiv.innerHTML = `🛑 CORS Error: Bouncer blocked this domain. Whitelist it first!`;
            }
        }

        fetchContactInfo();
    </script>
</body>
</html>
